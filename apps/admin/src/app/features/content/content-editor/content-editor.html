<div class="mb-6">
  <a routerLink="/content" class="mb-1 inline-flex items-center gap-1 text-xs text-(--color-text-muted) hover:text-(--color-text)">
    <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
    Content
  </a>
  <h1 class="text-lg font-semibold text-(--color-text)">{{ isNew() ? 'New content' : 'Edit content' }}</h1>
</div>

@if (loading()) {
  <div class="card h-64 animate-pulse"></div>
} @else {
  <div class="card max-w-2xl space-y-4 p-5">
    <div>
      <label class="label">Title</label>
      <input type="text" class="input" [(ngModel)]="form.title" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Slug <span class="text-(--color-text-faint)">(auto if empty)</span></label>
        <input type="text" class="input" [(ngModel)]="form.slug" />
      </div>
      <div>
        <label class="label">Type</label>
        <select class="input" [(ngModel)]="form.type">
          <option value="page">Page</option>
          <option value="banner">Banner</option>
          <option value="block">Block</option>
        </select>
      </div>
    </div>
    <div>
      <label class="label">Body</label>
      <textarea class="input" rows="6" [(ngModel)]="form.body"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Image URL</label>
        <input type="text" class="input" [(ngModel)]="form.imageUrl" />
      </div>
      <div>
        <label class="label">Link URL</label>
        <input type="text" class="input" [(ngModel)]="form.linkUrl" />
      </div>
    </div>
    <label class="flex items-center gap-2 text-sm text-(--color-text-muted)">
      <input type="checkbox" [(ngModel)]="form.published" />
      Published
    </label>
    <div class="flex justify-end gap-2 pt-2">
      <a routerLink="/content" class="btn-secondary">Cancel</a>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save content' }}
      </button>
    </div>
  </div>
}
