<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-lg font-semibold text-(--color-text)">Content</h1>
    <p class="text-sm text-(--color-text-muted)">{{ total() }} total</p>
  </div>
  <a routerLink="/content/new" class="btn-primary">
    <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14" /></svg>
    New content
  </a>
</div>

<div class="card">
  @if (loading()) {
    <app-loading-state [rows]="4" />
  } @else if (items().length === 0) {
    <app-empty-state title="No content yet" message="Pages, banners and blocks for storefronts to render.">
      <a routerLink="/content/new" class="btn-primary mt-2">New content</a>
    </app-empty-state>
  } @else {
    <div class="stagger divide-y divide-(--color-border)">
      @for (item of items(); track item._id) {
        <div class="flex items-center justify-between gap-3 px-4 py-3 hover:bg-(--color-surface-2)">
          <div>
            <p class="text-sm font-medium text-(--color-text)">{{ item.title }}</p>
            <p class="text-xs text-(--color-text-muted)">{{ item.type }} · /{{ item.slug }}</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs" [class]="item.published ? 'text-(--color-success)' : 'text-(--color-text-faint)'">
              {{ item.published ? 'Published' : 'Draft' }}
            </span>
            <a [routerLink]="['/content', item._id, 'edit']" class="icon-btn" aria-label="Edit">
              <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z" /></svg>
            </a>
            <button type="button" class="icon-btn hover:text-(--color-danger)" (click)="remove(item)" aria-label="Delete">
              <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z" /></svg>
            </button>
          </div>
        </div>
      }
    </div>
    <app-pagination [page]="page()" [total]="total()" [totalPages]="totalPages()" (pageChange)="page.set($event)" />
  }
</div>
