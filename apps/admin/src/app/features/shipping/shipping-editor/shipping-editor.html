<div class="mb-6">
  <a routerLink="/shipping" class="mb-1 inline-flex items-center gap-1 text-xs text-(--color-text-muted) hover:text-(--color-text)">
    <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
    Shipping
  </a>
  <h1 class="text-lg font-semibold text-(--color-text)">{{ isNew() ? 'New shipping zone' : 'Edit shipping zone' }}</h1>
</div>

@if (loading()) {
  <div class="card h-64 animate-pulse"></div>
} @else {
  <div class="card max-w-2xl space-y-4 p-5">
    <div>
      <label class="label">Zone name</label>
      <input type="text" class="input" [(ngModel)]="form.name" />
    </div>
    <div>
      <label class="label">Countries <span class="text-(--color-text-faint)">(comma separated ISO codes, empty = all)</span></label>
      <input type="text" class="input" placeholder="US, GB, DE" [(ngModel)]="form.countries" />
    </div>
    <label class="flex items-center gap-2 text-sm text-(--color-text-muted)">
      <input type="checkbox" [(ngModel)]="form.enabled" />
      Enabled
    </label>

    <div class="border-t border-(--color-border) pt-4">
      <div class="mb-2 flex items-center justify-between">
        <p class="text-sm font-medium text-(--color-text)">Rates</p>
        <button type="button" class="text-xs text-(--color-brand) hover:underline" (click)="addRate()">+ Add rate</button>
      </div>
      <div class="space-y-3">
        @for (rate of form.rates; track $index) {
          <div class="rounded-lg border border-(--color-border) p-3">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" class="input" placeholder="Rate name" [(ngModel)]="rate.name" [name]="'rate-name-' + $index" />
              <select class="input" [(ngModel)]="rate.type" [name]="'rate-type-' + $index">
                <option value="flat">Flat</option>
                <option value="free">Free</option>
                <option value="weight">Weight-based</option>
              </select>
              <input type="number" min="0" class="input" placeholder="Price" [(ngModel)]="rate.price" [name]="'rate-price-' + $index" />
              <div class="flex gap-2">
                <input type="number" class="input" placeholder="Min subtotal" [(ngModel)]="rate.minSubtotal" [name]="'rate-min-' + $index" />
                <input type="number" class="input" placeholder="Max subtotal" [(ngModel)]="rate.maxSubtotal" [name]="'rate-max-' + $index" />
              </div>
            </div>
            <button type="button" class="mt-2 text-xs text-(--color-danger) hover:underline" (click)="removeRate($index)">Remove rate</button>
          </div>
        } @empty {
          <p class="text-xs text-(--color-text-faint)">No rates yet — add at least one.</p>
        }
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a routerLink="/shipping" class="btn-secondary">Cancel</a>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save zone' }}
      </button>
    </div>
  </div>
}
