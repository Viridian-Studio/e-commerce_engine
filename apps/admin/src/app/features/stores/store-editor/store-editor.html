<div class="mb-6">
  <a routerLink="/stores" class="mb-1 inline-flex items-center gap-1 text-xs text-(--color-text-muted) hover:text-(--color-text)">
    <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
    Stores
  </a>
  <h1 class="text-lg font-semibold text-(--color-text)">{{ isNew() ? 'New store' : 'Edit store' }}</h1>
</div>

@if (loading()) {
  <div class="card h-64 animate-pulse"></div>
} @else {
  <div class="card max-w-2xl space-y-4 p-5">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Store name</label>
        <input type="text" class="input" [(ngModel)]="form.name" />
      </div>
      <div>
        <label class="label">Slug</label>
        <input type="text" class="input" [(ngModel)]="form.slug" />
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Domain</label>
        <input type="text" class="input" placeholder="shop.example.com" [(ngModel)]="form.domain" />
      </div>
      <div>
        <label class="label">Contact email</label>
        <input type="email" class="input" [(ngModel)]="form.contactEmail" />
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="label">Currency</label>
        <input type="text" class="input uppercase" maxlength="3" [(ngModel)]="form.currency" />
      </div>
      <div>
        <label class="label">Locale</label>
        <input type="text" class="input" [(ngModel)]="form.locale" />
      </div>
      <div>
        <label class="label">Timezone</label>
        <input type="text" class="input" [(ngModel)]="form.timezone" />
      </div>
    </div>
    <div>
      <label class="label">Status</label>
      <select class="input" [(ngModel)]="form.status">
        <option value="active">Active</option>
        <option value="draft">Draft</option>
        <option value="archived">Archived</option>
      </select>
    </div>

    <div class="border-t border-(--color-border) pt-4">
      <p class="mb-3 text-sm font-medium text-(--color-text)">Theme configuration</p>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="label">Primary color</label>
          <div class="flex items-center gap-2">
            <input type="color" class="h-9 w-9 shrink-0 rounded-lg border border-(--color-border) bg-transparent" [(ngModel)]="form.primaryColor" />
            <input type="text" class="input" [(ngModel)]="form.primaryColor" />
          </div>
        </div>
        <div>
          <label class="label">Accent color</label>
          <div class="flex items-center gap-2">
            <input type="color" class="h-9 w-9 shrink-0 rounded-lg border border-(--color-border) bg-transparent" [(ngModel)]="form.accentColor" />
            <input type="text" class="input" [(ngModel)]="form.accentColor" />
          </div>
        </div>
      </div>
      <div class="mt-4">
        <label class="label">Logo URL</label>
        <input type="text" class="input" [(ngModel)]="form.logoUrl" />
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a routerLink="/stores" class="btn-secondary">Cancel</a>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save store' }}
      </button>
    </div>
  </div>
}
