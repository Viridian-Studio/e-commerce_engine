<div class="mb-6">
  <h1 class="text-lg font-semibold text-(--color-text)">Settings</h1>
  <p class="text-sm text-(--color-text-muted)">Store-scoped key/value settings for storefront configuration.</p>
</div>

<div class="card max-w-2xl">
  <div class="border-b border-(--color-border) p-4">
    <div class="flex gap-2">
      <input type="text" class="input" placeholder="key" [(ngModel)]="newKey" />
      <input type="text" class="input" placeholder="value (plain text or JSON)" [(ngModel)]="newValue" />
      <button type="button" class="btn-primary shrink-0" [disabled]="saving() || !newKey.trim()" (click)="addSetting()">Add</button>
    </div>
  </div>

  @if (loading()) {
    <div class="p-4">
      <div class="h-8 animate-pulse rounded bg-(--color-surface-2)"></div>
    </div>
  } @else if (rows().length === 0) {
    <app-empty-state title="No settings yet" message="Add key/value pairs — e.g. checkout_notice, social_links." />
  } @else {
    <div class="divide-y divide-(--color-border)">
      @for (row of rows(); track row.key) {
        <div class="flex items-center gap-2 px-4 py-3">
          <span class="w-40 shrink-0 truncate font-mono text-sm text-(--color-text)">{{ row.key }}</span>
          <input type="text" class="input" [(ngModel)]="row.value" (blur)="updateRow(row)" />
          <button type="button" class="icon-btn shrink-0 hover:text-(--color-danger)" (click)="removeRow(row)" aria-label="Remove">
            <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z" /></svg>
          </button>
        </div>
      }
    </div>
  }
</div>
