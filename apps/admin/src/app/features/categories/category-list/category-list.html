<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-lg font-semibold text-(--color-text)">Categories</h1>
    <p class="text-sm text-(--color-text-muted)">{{ categories().length }} total</p>
  </div>
  <a routerLink="/categories/new" class="btn-primary">
    <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14" /></svg>
    New category
  </a>
</div>

<div class="card">
  @if (loading()) {
    <app-loading-state [rows]="5" />
  } @else if (rows().length === 0) {
    <app-empty-state title="No categories yet" message="Group products with categories like Hoodies or T-Shirts.">
      <a routerLink="/categories/new" class="btn-primary mt-2">New category</a>
    </app-empty-state>
  } @else {
    <div class="divide-y divide-(--color-border)">
      @for (c of rows(); track c._id) {
        <div class="flex items-center justify-between gap-3 px-4 py-3 hover:bg-(--color-surface-2)">
          <div class="flex items-center gap-2 text-sm" [style.padding-left.px]="c.depth * 20">
            @if (c.depth > 0) {
              <span class="text-(--color-text-faint)">↳</span>
            }
            @if (c.image) {
              <img [src]="c.image" alt="" class="h-8 w-8 rounded-lg object-cover" />
            } @else {
              <div class="h-8 w-8 rounded-lg bg-(--color-surface-3)"></div>
            }
            <span class="font-medium text-(--color-text)">{{ c.name }}</span>
            <span class="text-xs text-(--color-text-faint)">/{{ c.slug }}</span>
          </div>
          <div class="flex items-center gap-3">
            <app-status-badge [status]="c.status" />
            <a [routerLink]="['/categories', c._id, 'edit']" class="icon-btn" aria-label="Edit">
              <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z" /></svg>
            </a>
            <button type="button" class="icon-btn hover:text-(--color-danger)" (click)="remove(c)" aria-label="Delete">
              <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4"><path stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z" /></svg>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
