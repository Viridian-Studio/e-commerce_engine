<div class="mb-6">
  <a routerLink="/categories" class="mb-1 inline-flex items-center gap-1 text-xs text-(--color-text-muted) hover:text-(--color-text)">
    <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
    Categories
  </a>
  <h1 class="text-lg font-semibold text-(--color-text)">{{ isNew() ? 'New category' : 'Edit category' }}</h1>
</div>

@if (loading()) {
  <div class="card h-64 animate-pulse"></div>
} @else {
  <div class="card max-w-2xl space-y-4 p-5">
    <div>
      <label class="label">Name</label>
      <input type="text" class="input" [(ngModel)]="form.name" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Slug <span class="text-(--color-text-faint)">(auto if empty)</span></label>
        <input type="text" class="input" [(ngModel)]="form.slug" />
      </div>
      <div>
        <label class="label">Status</label>
        <select class="input" [(ngModel)]="form.status">
          <option value="active">Active</option>
          <option value="draft">Draft</option>
        </select>
      </div>
    </div>
    <div>
      <label class="label">Description</label>
      <textarea class="input" rows="3" [(ngModel)]="form.description"></textarea>
    </div>
    <div>
      <label class="label">Image URL</label>
      <input type="text" class="input" placeholder="https://…" [(ngModel)]="form.image" />
    </div>
    <div>
      <label class="label">Parent category</label>
      <select class="input" [(ngModel)]="form.parentId">
        <option value="">None (top level)</option>
        @for (c of parentOptions(); track c._id) {
          <option [value]="c._id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div class="border-t border-(--color-border) pt-4">
      <p class="mb-3 text-sm font-medium text-(--color-text)">SEO</p>
      <div class="space-y-3">
        <div>
          <label class="label">Meta title</label>
          <input type="text" class="input" [(ngModel)]="form.seo.metaTitle" />
        </div>
        <div>
          <label class="label">Meta description</label>
          <textarea class="input" rows="2" [(ngModel)]="form.seo.metaDescription"></textarea>
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a routerLink="/categories" class="btn-secondary">Cancel</a>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save category' }}
      </button>
    </div>
  </div>
}
