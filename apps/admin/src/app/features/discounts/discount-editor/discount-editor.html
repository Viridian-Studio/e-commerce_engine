<div class="mb-6">
  <a routerLink="/discounts" class="mb-1 inline-flex items-center gap-1 text-xs text-(--color-text-muted) hover:text-(--color-text)">
    <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
    Discounts
  </a>
  <h1 class="text-lg font-semibold text-(--color-text)">{{ isNew() ? 'New discount' : 'Edit discount' }}</h1>
</div>

@if (loading()) {
  <div class="card h-64 animate-pulse"></div>
} @else {
  <div class="card max-w-2xl space-y-4 p-5">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Code</label>
        <input type="text" class="input font-mono uppercase" [(ngModel)]="form.code" />
      </div>
      <div>
        <label class="label">Status</label>
        <select class="input" [(ngModel)]="form.status">
          <option value="active">Active</option>
          <option value="scheduled">Scheduled</option>
          <option value="disabled">Disabled</option>
          <option value="expired">Expired</option>
        </select>
      </div>
    </div>
    <div>
      <label class="label">Description</label>
      <input type="text" class="input" [(ngModel)]="form.description" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Type</label>
        <select class="input" [(ngModel)]="form.type">
          <option value="percentage">Percentage</option>
          <option value="fixed">Fixed amount</option>
        </select>
      </div>
      <div>
        <label class="label">Value</label>
        <input type="number" min="0" class="input" [(ngModel)]="form.value" />
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="label">Minimum subtotal</label>
        <input type="number" min="0" class="input" [(ngModel)]="form.minSubtotal" />
      </div>
      <div>
        <label class="label">Max discount (percentage cap)</label>
        <input type="number" min="0" class="input" [(ngModel)]="form.maxDiscount" />
      </div>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="label">Usage limit</label>
        <input type="number" min="0" class="input" [(ngModel)]="form.usageLimit" />
      </div>
      <div>
        <label class="label">Starts</label>
        <input type="date" class="input" [(ngModel)]="form.startsAt" />
      </div>
      <div>
        <label class="label">Ends</label>
        <input type="date" class="input" [(ngModel)]="form.endsAt" />
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a routerLink="/discounts" class="btn-secondary">Cancel</a>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Saving…' : 'Save discount' }}
      </button>
    </div>
  </div>
}
