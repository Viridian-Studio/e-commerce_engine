<section class="section-dark border-b border-(--color-store-border) py-8">
  <div class="container-store">
    <app-breadcrumb [items]="breadcrumbs()" />
    <h1 class="heading-xl mt-4">{{ title() }}</h1>
    @if (description()) {
      <p class="mt-3 max-w-xl text-sm text-(--color-store-text-muted)">{{ description() }}</p>
    }
  </div>
</section>

<section class="section-dark py-8 sm:py-10">
  <div class="container-store">
    @if (loading()) {
      <app-product-grid-skeleton [count]="9" />
    } @else if (error()) {
      <app-error-state message="Ezt a kollekciót nem sikerült betölteni." (retry)="retry()" />
    } @else {
      <div class="grid grid-cols-1 gap-8 lg:grid-cols-[220px_1fr]">
        <aside class="hidden lg:block">
          <app-filter-panel
            [siblingsTitle]="mode() === 'category' ? 'Kategóriák' : 'Böngészés'"
            [siblings]="siblings()"
            [sizes]="sizeFacets()"
            [colors]="colorFacets()"
            [selectedSizes]="filters().sizes"
            [selectedColors]="filters().colors"
            [maxPrice]="filters().maxPrice"
            [priceCeiling]="priceCeiling()"
            (sizeToggled)="toggleSize($event)"
            (colorToggled)="toggleColor($event)"
            (maxPriceChanged)="setMaxPrice($event)"
            (cleared)="clearFilters()"
          />
        </aside>

        <div>
          <div class="mb-6 flex items-center justify-between gap-3">
            <button type="button" class="btn-outline text-xs lg:hidden" (click)="mobileFiltersOpen.set(true)">
              Szűrők
            </button>
            <p class="text-xs text-(--color-store-text-muted)">{{ filteredProducts().length }} termék</p>
            <app-sort-dropdown [value]="filters().sort" (changed)="setSort($event)" />
          </div>

          @if (pageProducts().length === 0) {
            <app-empty-state title="Nincs a szűrésnek megfelelő termék" message="Töröld a szűrőket, vagy nézz körül egy másik kategóriában.">
              <button type="button" class="btn-outline mt-2" (click)="clearFilters()">Szűrők törlése</button>
            </app-empty-state>
          } @else {
            <app-product-grid [products]="pageProducts()" />
            <app-pagination [page]="filters().page" [totalPages]="totalPages()" (pageChanged)="setPage($event)" />
          }
        </div>
      </div>
    }
  </div>
</section>

@if (mobileFiltersOpen()) {
  <div class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-black/60" (click)="mobileFiltersOpen.set(false)"></div>
    <div class="section-dark absolute inset-y-0 left-0 flex w-[85vw] max-w-sm flex-col overflow-y-auto border-r border-(--color-store-border) p-6">
      <div class="mb-6 flex items-center justify-between">
        <h2 class="heading-md">Szűrők</h2>
        <button type="button" class="icon-btn" (click)="mobileFiltersOpen.set(false)" aria-label="Szűrők bezárása">&times;</button>
      </div>
      <app-filter-panel
        [siblingsTitle]="mode() === 'category' ? 'Kategóriák' : 'Böngészés'"
        [siblings]="siblings()"
        [sizes]="sizeFacets()"
        [colors]="colorFacets()"
        [selectedSizes]="filters().sizes"
        [selectedColors]="filters().colors"
        [maxPrice]="filters().maxPrice"
        [priceCeiling]="priceCeiling()"
        (sizeToggled)="toggleSize($event)"
        (colorToggled)="toggleColor($event)"
        (maxPriceChanged)="setMaxPrice($event)"
        (cleared)="clearFilters()"
      />
      <button type="button" class="btn-primary mt-6" (click)="mobileFiltersOpen.set(false)">Találatok mutatása</button>
    </div>
  </div>
}
